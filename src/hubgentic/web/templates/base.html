<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hubgentic{% endblock %}</title>
  <meta name="description" content="The entity & lineage layer for enterprise AI agents. Resolve customers across every system of record — without moving the data.">
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  {% block head_scripts %}{% endblock %}
</head>
<body>
  {% if flash %}
  <div class="alert {{ 'alert-error' if flash.k == 'error' else 'alert-ok' }} toast" role="status">{{ flash.m }}</div>
  {% endif %}
  {% block body %}{% endblock %}
  {% block feedback %}{% include "_feedback.html" %}{% endblock %}
</body>
</html>
