<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hubgentic{% endblock %}</title>
  <meta name="description" content="The entity & lineage layer for enterprise AI agents. Resolve customers across every system of record — without moving the data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bf0'/%3E%3Cpath d='M9 9v14M23 9v14M9 16h14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  {% block head_scripts %}{% endblock %}
</head>
<body>
  {% if flash %}
  <div class="alert {{ 'alert-error' if flash.k == 'error' else 'alert-ok' }} toast" role="status">{{ flash.m }}</div>
  {% endif %}
  {% block body %}{% endblock %}
  {% block feedback %}{% include "_feedback.html" %}{% endblock %}
</body>
</html>
