problem:
  kicker: "The problem"
  title: "AI agents don't fail because of the model. They fail because they don't know your data."
  lead: "Every company keeps the same information in several systems, written in different ways. People connect the dots from experience. Agents can't."
  items:
    - title: "One customer, four versions"
      body: "In the ERP it's ROSSI MARIO SRL, in the CRM Mario Rossi, in the online store an email address, in a spreadsheet a VAT number. To an agent, those are four different customers."
    - title: "No memory"
      body: "Every conversation starts from scratch: the agent doesn't know what was promised, decided or already solved last week."
    - title: "No traceability"
      body: "When an agent answers, nobody knows which system the data came from. That isn't good enough for internal controls, the EU AI Act or your customers' trust."

services:
  kicker: "What we do"
  title: "We make your business readable by AI. Inside and out."
  lead: "Inside, so your agents work on consistent data. Outside, so ChatGPT and other assistants find and recommend you. Four services, available today."
  items:
    - tag: SMEs
      title: "AI strategy"
      body: "From “we should do something with AI” to a plan with priorities, costs and expected returns."
      points:
        - "Assessment of processes, data and skills"
        - "Use-case map, ranked by impact"
        - "Build-vs-buy decisions and vendor selection"
        - "Data governance and EU AI Act readiness"
        - "Workshops for leadership and teams"
    - tag: Startups
      title: "Startup advisory"
      body: "A part-time Head of AI, until you need a full-time one."
      points:
        - "Architecture and model selection"
        - "Data strategy and defensibility"
        - "Inference costs under control"
        - "Technical review ahead of a funding round"
    - tag: Delivery
      title: "Agents in production"
      body: "Agents for customer service, back office and sales, built into your systems rather than beside them."
      points:
        - "Integration with ERP, CRM and e-commerce"
        - "Quality tests and metrics before go-live"
        - "Human oversight where it matters"
        - "Continuous monitoring after launch"
    - tag: Visibility
      title: "AI assistant visibility"
      body: "Make sure ChatGPT, Perplexity, Gemini and Claude describe your business correctly, and recommend it."
      points:
        - "Audit of what AI says about you today"
        - "Structured data and machine-readable content"
        - "Benchmark against competitors"
        - "Ongoing monitoring"

method:
  kicker: "How we work"
  title: "Short steps, measurable results."
  lead: "No endless projects. Every phase has a scope, a timeline and a price agreed before we start."
  steps:
    - meta: "30 minutes · free"
      title: "Intro call"
      body: "We learn where you are and what you want to achieve. If AI isn't the right answer, we'll tell you."
    - meta: "2 weeks · fixed price"
      title: "Assessment"
      body: "We review your processes and data, find the best use cases and deliver a prioritised roadmap with estimates."
    - meta: "6–8 weeks"
      title: "Pilot"
      body: "We put one use case into production on real data, with success metrics agreed up front."
    - meta: "Tailored"
      title: "Scale"
      body: "We extend to more processes and train your team so it can run on its own."

platform:
  badge: "Coming soon"
  kicker: "The platform"
  title: "Ontology and memory for your agents."
  lead: "We're building the missing layer between business systems and AI agents. Hubgentic connects your ERP, CRM and databases without moving the data, recognises the same entities across systems, keeps their memory and shows where every piece of information comes from."
  features:
    - title: "A shared ontology"
      body: "One model of customers, suppliers, products and contracts, independent of the software you use."
    - title: "Entity resolution"
      body: "The same customer is recognised even when names, codes and emails don't match, with an explicit confidence score."
    - title: "Memory for agents"
      body: "Facts, decisions and interactions stay available over time, with permissions set per source."
    - title: "Field-level provenance"
      body: "Every answer cites the system, record and field it came from. Ready for audits."
    - title: "Your data stays put"
      body: "Sources are queried in real time: no copies, no migrations."
    - title: "Open to your agents"
      body: "Connects to the agents you already use through an API and MCP, the open standard for connecting AI models to tools and data."
  cta: "Request early access"
  note: "We're selecting a small group of pilot companies to build it with. Access by invitation."
  mock:
    aria: "Example of a unified customer record in the Hubgentic platform"
    kind: Customer
    name: "Rossi Mario S.r.l."
    sources: "3 sources"
    rows:
      - {label: "Legal name", value: "ROSSI MARIO SRL", source: ERP, tone: s1}
      - {label: "VAT number", value: "IT01234567890", source: ERP, tone: s1}
      - {label: "Email", value: "m.rossi@rossisrl.it", source: CRM, tone: s2}
      - {label: "Last order", value: "#1042 · out for delivery", source: E-commerce, tone: s3}
    match_label: "Same entity"
    match_rule: "VAT number + legal name"
    match_score: "0.97"
    memory_title: Memory
    memory:
