principles:
  kicker: "How we think"
  title: "Four commitments, in writing."
  items:
    - title: "Measurable results"
      body: "Every project starts from agreed metrics. If we can't measure it, we don't do it."
    - title: "Vendor-independent"
      body: "We recommend the technology that fits you best, even when it isn't ours."
    - title: "Your data stays yours"
      body: "Least access necessary, no unnecessary copies, GDPR-compliant."
    - title: "Clarity"
      body: "Fixed prices, clear timelines, no jargon."

faq:
  title: "Frequently asked questions"
  items:
    - q: "How much does it cost?"
      a: "The intro call is free. The assessment and the pilot have a fixed price, set after the first call based on scope. No surprises at the end of the month."
    - q: "Do we need to move or migrate our data?"
      a: "No. We work with the systems you already use. The platform queries your sources in real time without copying them."
    - q: "We're a small company. Does this make sense for us?"
      a: "Often, yes: smaller companies have shorter processes and faster decisions, and one well-chosen use case can pay for itself quickly. On the call we'll work out together whether there's a clear return. If there isn't, we'll tell you."
    - q: "When will the platform be available?"
      a: "It's being built with a small group of pilot companies. Request early access and we'll be in touch when new places open."
    - q: "How do you handle the EU AI Act?"
      a: "We help you classify your use cases, document them and put traceability and human oversight in place where required. For the legal side we work alongside your advisers."
    - q: "Do you work outside Italy?"
      a: "Yes. We work in English and Italian, remotely and on site when needed."

