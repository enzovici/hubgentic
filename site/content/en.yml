privacy:
  title: "Privacy notice"
  updated: "Last updated: November 2026"
  intro: "This notice explains what personal data we collect when you visit www.hubgentic.ai or write to us, why we do it and what your rights are under Regulation (EU) 2016/679 (GDPR)."
  sections:
    - title: "Data controller"
      body:
        - "The data controller is Complify PTE. LTD. (UEN 202400236R), 32 Pekin Street, Singapore, which operates the Hubgentic brand. For any privacy request, email info@hubgentic.ai."
    - title: "What we collect"
      body:
        - "Contact form: your name, email, company, type of organisation, interests and the message you choose to send."
        - "Technical data: when you visit the site, the server records technical information such as IP address, date and time of the request and browser type."
    - title: "Why we use it and on what basis"
      body:
        - "To answer your request and, if you ask, prepare a proposal: steps taken at your request before entering into a contract (Art. 6(1)(b) GDPR)."
        - "To protect the site from abuse and keep it secure: the controller's legitimate interest (Art. 6(1)(f) GDPR)."
        - "We don't use your data for newsletters or marketing without your explicit, separate consent, and we never sell it."
    - title: "Cookies"
      body:
        - "This site uses no cookies, analytics or tracking tools. Fonts are hosted on our own servers, so your visit isn't shared with third-party services."
    - title: "Where and for how long"
      body:
        - "The site and form data are hosted on servers in Switzerland, a country recognised by the European Commission as providing adequate data protection."
        - "We keep contact requests for as long as needed to handle them and no longer than 24 months after our last contact, unless the law requires otherwise. Technical logs are kept for a limited period, for security purposes only."
    - title: "Your rights"
      body:
        - "You can ask at any time to access, correct, delete, restrict or port your data, or object to its processing, by emailing info@hubgentic.ai."
        - "You also have the right to lodge a complaint with your data protection authority; in Italy, the Garante per la protezione dei dati personali (www.garanteprivacy.it)."
