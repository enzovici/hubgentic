faq:
  title: "Domande frequenti"
  items:
    - q: "Quanto costa?"
      a: "La call conoscitiva è gratuita. Assessment e pilota hanno un prezzo fisso, che definiamo dopo la prima call in base al perimetro. Nessuna sorpresa a fine mese."
    - q: "Dobbiamo spostare o migrare i nostri dati?"
      a: "No. Lavoriamo sui sistemi che usi già. La piattaforma interroga le fonti in tempo reale, senza copiarle."
    - q: "Siamo una piccola azienda: ha senso per noi?"
      a: "Spesso sì: le PMI hanno processi più corti e decisioni più rapide, e un solo caso d'uso ben scelto può ripagarsi in fretta. Nella call capiamo insieme se c'è un ritorno chiaro. Se non c'è, te lo diciamo."
    - q: "Quando sarà disponibile la piattaforma?"
      a: "È in sviluppo con un gruppo ristretto di aziende pilota. Richiedi l'accesso anticipato: ti contattiamo quando apriamo nuovi posti."
    - q: "Come gestite l'AI Act?"
      a: "Ti aiutiamo a classificare i casi d'uso, a documentarli e a garantire tracciabilità e supervisione umana dove richiesto. Per gli aspetti legali lavoriamo insieme ai tuoi consulenti."
    - q: "Lavorate anche fuori dall'Italia?"
      a: "Sì. Lavoriamo in italiano e in inglese, da remoto e in presenza quando serve."

