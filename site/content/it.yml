problem:
  kicker: "Il problema"
  title: "Gli agenti AI non sbagliano per colpa del modello. Sbagliano perché non conoscono i tuoi dati."
  lead: "Ogni azienda ha le stesse informazioni sparse in più sistemi, scritte in modi diversi. Una persona le ricollega con l'esperienza. Un agente no."
  items:
    - title: "Lo stesso cliente, quattro versioni"
      body: "Nel gestionale è ROSSI MARIO SRL, nel CRM Mario Rossi, nell'e-commerce un indirizzo email, in Excel una partita IVA. Per un agente sono quattro clienti diversi."
    - title: "Nessuna memoria"
      body: "Ogni conversazione riparte da zero: l'agente non sa cosa è stato promesso, deciso o già risolto la settimana scorsa."
    - title: "Nessuna tracciabilità"
      body: "Quando un agente risponde, nessuno sa da quale sistema arriva il dato. Per i controlli interni, per l'AI Act e per la fiducia dei clienti non basta."

services:
  kicker: "Cosa facciamo"
  title: "Rendiamo la tua azienda leggibile dall'AI. Dentro e fuori."
  lead: "Dentro, perché i tuoi agenti lavorino su dati coerenti. Fuori, perché ChatGPT e gli altri assistenti ti trovino e ti raccomandino. Quattro servizi, disponibili da subito."
  items:
    - tag: PMI
      title: "Strategia AI"
      body: "Dal «dovremmo fare qualcosa con l'AI» a un piano con priorità, costi e ritorni attesi."
      points:
        - "Valutazione di processi, dati e competenze"
        - "Mappa dei casi d'uso, ordinati per impatto"
        - "Scelte make-or-buy e selezione dei fornitori"
        - "Governance dei dati e preparazione all'AI Act"
        - "Workshop per management e team"
    - tag: Startup
      title: "Advisory per startup"
      body: "Un Head of AI a tempo parziale, finché non te ne serve uno a tempo pieno."
      points:
        - "Architettura e scelta dei modelli"
        - "Strategia dati e vantaggio difendibile"
        - "Costi di inferenza sotto controllo"
        - "Revisione tecnica in vista di un round"
    - tag: Implementazione
      title: "Agenti in produzione"
      body: "Agenti per assistenza clienti, back office e vendite, costruiti dentro i tuoi sistemi, non accanto."
      points:
        - "Integrazione con gestionale, CRM ed e-commerce"
        - "Test e metriche di qualità prima del go-live"
        - "Supervisione umana dove serve"
        - "Monitoraggio continuo dopo il lancio"
    - tag: Visibilità
      title: "Visibilità sugli assistenti AI"
      body: "Fai in modo che ChatGPT, Perplexity, Gemini e Claude descrivano correttamente la tua azienda e la raccomandino."
      points:
        - "Audit di come l'AI parla di te oggi"
        - "Dati strutturati e contenuti leggibili dalle macchine"
        - "Confronto con i concorrenti"
        - "Monitoraggio nel tempo"

method:
  kicker: "Come lavoriamo"
  title: "Passi brevi, risultati misurabili."
  lead: "Niente progetti infiniti. Ogni fase ha un perimetro, una durata e un prezzo concordati prima di iniziare."
  steps:
    - meta: "30 minuti · gratuita"
      title: "Call conoscitiva"
      body: "Capiamo dove sei e cosa vuoi ottenere. Se l'AI non è la risposta giusta, te lo diciamo."
    - meta: "2 settimane · prezzo fisso"
      title: "Assessment"
      body: "Analizziamo processi e dati, individuiamo i casi d'uso migliori e consegniamo una roadmap con priorità e stime."
    - meta: "6–8 settimane"
      title: "Pilota"
      body: "Portiamo un caso d'uso in produzione, su dati reali, con metriche di successo decise insieme all'inizio."
    - meta: "Su misura"
      title: "Scala"
      body: "Estendiamo ad altri processi e formiamo il tuo team, perché resti autonomo."

platform:
  badge: "In arrivo"
  kicker: "La piattaforma"
  title: "Ontologia e memoria per i tuoi agenti."
  lead: "Stiamo costruendo il livello che manca tra i sistemi aziendali e gli agenti AI. Hubgentic collega gestionale, CRM e database senza spostare i dati, riconosce le stesse entità nei diversi sistemi, ne conserva la memoria e mostra da dove arriva ogni informazione."
  features:
    - title: "Un'ontologia condivisa"
      body: "Un modello unico di clienti, fornitori, prodotti e contratti, indipendente dai software che usi."
    - title: "Riconoscimento delle entità"
      body: "Lo stesso cliente viene riconosciuto anche quando nomi, codici ed email non coincidono, con un livello di confidenza esplicito."
    - title: "Memoria per gli agenti"
      body: "Fatti, decisioni e interazioni restano disponibili nel tempo, con permessi definiti per ogni fonte."
    - title: "Tracciabilità campo per campo"
      body: "Ogni risposta indica sistema, record e campo di origine. Pronta per audit e verifiche."
    - title: "I dati restano dove sono"
      body: "Le fonti vengono interrogate in tempo reale, senza copie né migrazioni."
    - title: "Aperta ai tuoi agenti"
      body: "Si collega agli agenti che usi già tramite API e MCP, lo standard aperto per collegare strumenti e dati ai modelli AI."
  cta: "Richiedi l'accesso anticipato"
  note: "Stiamo selezionando poche aziende pilota con cui costruirla. Accesso su invito."
