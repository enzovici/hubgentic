privacy:
  title: "Informativa sulla privacy"
  updated: "Ultimo aggiornamento: novembre 2026"
  intro: "Questa informativa spiega quali dati personali raccogliamo quando visiti www.hubgentic.ai o ci scrivi, perché lo facciamo e quali sono i tuoi diritti ai sensi del Regolamento (UE) 2016/679 (GDPR)."
  sections:
    - title: "Titolare del trattamento"
      body:
        - "Il titolare del trattamento è Complify PTE. LTD. (UEN 202400236R), 32 Pekin Street, Singapore, che gestisce il marchio Hubgentic. Per qualsiasi richiesta relativa alla privacy scrivi a info@hubgentic.ai."
    - title: "Quali dati raccogliamo"
      body:
        - "Modulo di contatto: nome e cognome, email, azienda, tipo di realtà, interessi e il messaggio che scegli di inviarci."
        - "Dati tecnici: quando visiti il sito, il server registra informazioni tecniche come indirizzo IP, data e ora della richiesta e tipo di browser."
    - title: "Perché li usiamo e su quale base"
      body:
        - "Per rispondere alla tua richiesta e, se lo chiedi, prepararti una proposta: misure precontrattuali adottate su tua richiesta (art. 6.1.b GDPR)."
        - "Per proteggere il sito da abusi e garantirne la sicurezza: legittimo interesse del titolare (art. 6.1.f GDPR)."
        - "Non usiamo i tuoi dati per newsletter o marketing senza un tuo consenso esplicito e separato, e non li vendiamo a terzi."
    - title: "Cookie"
      body:
        - "Questo sito non usa cookie, strumenti di analisi o di tracciamento. I caratteri tipografici sono ospitati sui nostri server: la tua visita non viene comunicata a servizi di terze parti."
    - title: "Dove e per quanto tempo"
      body:
        - "Il sito e i dati del modulo sono ospitati su server in Svizzera, Paese riconosciuto dalla Commissione europea come adeguato per la protezione dei dati."
        - "Per poterti rispondere rapidamente, ogni richiesta ci viene anche notificata via email: in questo passaggio i dati sono trattati dal nostro fornitore di posta elettronica, per nostro conto."
        - "Conserviamo le richieste di contatto per il tempo necessario a gestirle e comunque non oltre 24 mesi dall'ultimo contatto, salvo obblighi di legge. I log tecnici sono conservati per un periodo limitato, per sole finalità di sicurezza."
    - title: "I tuoi diritti"
      body:
        - "Puoi chiedere in qualsiasi momento l'accesso ai tuoi dati, la rettifica, la cancellazione, la limitazione del trattamento, la portabilità o opporti al trattamento, scrivendo a info@hubgentic.ai."
        - "Hai inoltre il diritto di proporre reclamo al Garante per la protezione dei dati personali (www.garanteprivacy.it)."
