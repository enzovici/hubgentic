[project]
name = "hubgentic"
version = "0.1.0"
description = "Vendor-neutral, MCP-exposed federated semantic catalog for regulated financial services (v0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
demo = "hubgentic.demo:main"
hubgentic-server = "hubgentic.server.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubgentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
